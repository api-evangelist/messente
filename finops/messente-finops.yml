description: >-
  FinOps view of Messente spend. Messente bills prepaid, usage-based per-message
  rates that vary by destination country, network (MCC/MNC), and channel (SMS,
  Viber, WhatsApp). WhatsApp follows Meta per-conversation category pricing.
  Number Lookup (HLR) and Number Verification (2FA) are billed per lookup / per
  verification. Account credit is drawn down as usage occurs and live rates are
  available via the Pricing API.
notes: >-
  Per-country and per-network rates change frequently; pull live rates from the
  Pricing API (GET /pricelist, GET /prices) and reconcile spend against the
  Statistics API and account balance during reconciliation.
