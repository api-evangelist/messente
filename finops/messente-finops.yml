meters:
- name: sms_messages
  description: SMS messages sent, billed per message by destination country and network.
  unit: messages
  aggregation: sum
  dimensions:
  - account
  - country
  - network
- name: viber_messages
  description: Viber messages sent, billed per message by destination country and network.
  unit: messages
  aggregation: sum
  dimensions:
  - account
  - country
  - network
- name: whatsapp_conversations
  description: WhatsApp conversations, billed per conversation per Meta category plus markup.
  unit: conversations
  aggregation: sum
  dimensions:
  - account
  - country
  - category
- name: number_lookups
  description: HLR number lookups, billed per lookup by destination country.
  unit: lookups
  aggregation: sum
  dimensions:
  - account
  - country
- name: number_verifications
  description: PIN-based number verifications (2FA), billed per verification.
  unit: verifications
  aggregation: sum
  dimensions:
  - account
  - country
principles:
- name: Visibility
  description: Pull the Statistics API and account balance to inspect per-country, per-network, and per-channel send volume and cost.
- name: Allocation
  description: Tag API credentials and sender IDs per workload/team; map to internal cost centers.
- name: Optimization
  description: Order the Omnimessage fallback chain to prefer lower-cost channels first; use HLR lookup to drop invalid numbers before sending; blacklist to avoid wasted sends.
- name: Accountability
  description: Assign owners per project/credential; review prepaid credit burn and per-country spend against budget.
