name: Messente
kind: company
description: Messente is an Estonian CPaaS provider of global messaging and user
  verification services. A single Omnimessage endpoint sends SMS, Viber, WhatsApp,
  and Telegram with an automatic fallback chain, backed by contacts and groups in
  the Phonebook, phone number (HLR) lookup, PIN-based number verification / 2FA,
  delivery reports, and messaging statistics over an HTTP Basic authenticated REST
  API at api.messente.com/v1.
