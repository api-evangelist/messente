aid: messente
url: https://raw.githubusercontent.com/api-evangelist/messente/refs/heads/main/apis.yml
name: Messente
kind: company
description: Messente is an Estonian CPaaS provider of global messaging and user
  verification services. A single Omnimessage endpoint sends SMS, Viber, WhatsApp,
  and Telegram with an automatic fallback chain, backed by contacts and groups in
  the Phonebook, phone number (HLR) lookup, PIN-based number verification / 2FA,
  delivery reports, and messaging statistics over an HTTP Basic authenticated REST
  API at api.messente.com/v1.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- CPaaS
- Messaging
- SMS
- Viber
- WhatsApp
- Verification
- 2FA
created: '2026-07-01'
modified: '2026-07-01'
specificationVersion: '0.19'
apis:
- aid: messente:messente-omnimessage-api
  name: Messente Omnimessage API
  tags:
  - Omnimessage
  - Messaging
  - Fallback
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://messente.com/documentation/omnichannel-api
  baseURL: https://api.messente.com/v1
  properties:
  - url: https://messente.com/documentation/omnichannel-api
    type: Documentation
  - url: https://messente.com/documentation
    type: APIReference
  - url: openapi/messente-openapi.yml
    type: OpenAPI
  description: The unified Omnimessage endpoint sends a message across SMS, Viber,
    WhatsApp, and Telegram as an ordered fallback chain, attempting each channel in
    priority order until delivery succeeds, and supports cancelling scheduled messages.
- aid: messente:messente-sms-api
  name: Messente SMS API
  tags:
  - SMS
  - Text Messaging
  - Bulk
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://messente.com/documentation/omnichannel-api
  baseURL: https://api.messente.com/v1
  properties:
  - url: https://messente.com/documentation/omnichannel-api
    type: Documentation
  - url: openapi/messente-openapi.yml
    type: OpenAPI
  description: Global SMS delivery via the Omnimessage endpoint with sender ID, GSM/Unicode
    autoconvert, validity periods, and bulk sending to many recipients in a single
    request.
- aid: messente:messente-contacts-api
  name: Messente Contacts API
  tags:
  - Contacts
  - Phonebook
  - CRM
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://messente.com/documentation/phonebook-api
  baseURL: https://api.messente.com/v1
  properties:
  - url: https://messente.com/documentation/phonebook-api
    type: Documentation
  - url: openapi/messente-openapi.yml
    type: OpenAPI
  description: Create, read, update, and delete contacts in the Messente Phonebook
    under /phonebook/contacts, manage their group memberships, and maintain a phone
    number blacklist to suppress unwanted messages.
- aid: messente:messente-groups-api
  name: Messente Groups API
  tags:
  - Groups
  - Phonebook
  - Segmentation
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://messente.com/documentation/phonebook-api
  baseURL: https://api.messente.com/v1
  properties:
  - url: https://messente.com/documentation/phonebook-api
    type: Documentation
  - url: openapi/messente-openapi.yml
    type: OpenAPI
  description: Manage contact groups under /phonebook/groups for segmentation and
    targeted bulk messaging, including creating, updating, listing, and deleting groups
    and adding or removing contacts from them.
- aid: messente:messente-number-lookup-api
  name: Messente Number Lookup API
  tags:
  - Number Lookup
  - HLR
  - Number Verification
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://messente.com/documentation/phone-number-lookup-api
  baseURL: https://api.messente.com/v1
  properties:
  - url: https://messente.com/documentation/phone-number-lookup-api
    type: Documentation
  - url: openapi/messente-openapi.yml
    type: OpenAPI
  description: Synchronous HLR lookup at /hlr/sync returns network, roaming, and
    portability information for phone numbers, plus PIN-based number verification (2FA)
    at /verify/start and /verify/pin for confirming a user controls a number.
- aid: messente:messente-statistics-api
  name: Messente Statistics API
  tags:
  - Statistics
  - Reporting
  - Analytics
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://messente.com/documentation/statistics-api
  baseURL: https://api.messente.com/v1
  properties:
  - url: https://messente.com/documentation/statistics-api
    type: Documentation
  - url: openapi/messente-openapi.yml
    type: OpenAPI
  description: Request messaging statistics reports by country and destination network
    (MCC/MNC) over a date range at /statistics/reports, reporting sent, delivered,
    and failed message counts.
- aid: messente:messente-delivery-reports-api
  name: Messente Delivery Reports API
  tags:
  - Delivery Reports
  - Webhooks
  - Status
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://messente.com/documentation/omnichannel-api/delivery-report
  baseURL: https://api.messente.com/v1
  properties:
  - url: https://messente.com/documentation/omnichannel-api/delivery-report
    type: Documentation
  - url: openapi/messente-openapi.yml
    type: OpenAPI
  description: Retrieve per-channel delivery status for a sent Omnimessage at
    /omnimessage/{omnimessageId}/status, or receive asynchronous status pushes to a
    configured delivery report callback (webhook) URL.
